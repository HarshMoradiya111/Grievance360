{% extends "base.html" %}
{% block title %}Reset password &middot; Grievance360{% endblock %}
{% block content %}

<div class="ge-page-head">
  <h4><i class="bi bi-key me-1"></i> Reset password — {{ target_user.name }}</h4>
  <p class="ge-page-sub">{{ target_user.email }}</p>
</div>

<div class="row justify-content-center">
  <div class="col-12 col-md-6">
    <div class="ge-card p-4">
      <form method="post">
        <div class="mb-3">
          <label class="form-label">New password</label>
          <input type="password" class="form-control" name="password"
                 required minlength="6">
        </div>
        <div class="mb-3">
          <label class="form-label">Confirm</label>
          <input type="password" class="form-control" name="confirm" required>
        </div>
        <div class="d-flex gap-2">
          <button class="btn btn-primary">
            <i class="bi bi-check2"></i> Set password
          </button>
          <a href="{{ url_for('admin_users') }}" class="btn btn-outline-secondary">
            Cancel
          </a>
        </div>
      </form>
    </div>
  </div>
</div>

{% endblock %}
