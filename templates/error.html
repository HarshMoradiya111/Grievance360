{% extends "base.html" %}
{% block title %}Error {{ code }} &middot; Grievance360{% endblock %}

{% block content %}
<div class="row justify-content-center mt-4">
  <div class="col-12 col-md-8 col-lg-6">
    <div class="ge-card p-4 text-center">
      <i class="bi bi-exclamation-triangle fs-1 text-warning"></i>
      <h1 class="display-5 fw-bold mt-2 mb-1">{{ code }}</h1>
      <p class="text-muted ge-wrap">{{ message }}</p>
      <a href="{{ url_for('index') }}" class="btn btn-primary w-100 mt-2">
        <i class="bi bi-house"></i> Back to home
      </a>
    </div>
  </div>
</div>
{% endblock %}
