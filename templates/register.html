{% extends "base.html" %}
{% block title %}Register &middot; Grievance360{% endblock %}

{% block content %}
<div class="row justify-content-center mt-2 mt-md-4">
  <div class="col-12 col-md-9 col-lg-6">
    <div class="ge-card p-3 p-md-4">

      <div class="text-center mb-3">
        <img src="/logo/Grievance360.png" alt="Grievance360 Logo" height="64" class="mb-2">
        <h4 class="mt-1 mb-0">Student registration</h4>
        <p class="text-muted small mb-0">
          Staff and admin accounts are created by the administrator
        </p>
      </div>

      <form method="POST" novalidate>
        <div class="row g-3">

          <div class="col-12">
            <label for="name" class="form-label">Full name</label>
            <input type="text" class="form-control" id="name" name="name"
                   value="{{ form.get('name', '') }}" required
                   autocomplete="name" placeholder="Enter your full name">
          </div>

          <div class="col-12">
            <label for="email" class="form-label">Email address</label>
            <input type="email" class="form-control" id="email" name="email"
                   value="{{ form.get('email', '') }}" required
                   inputmode="email" autocomplete="email"
                   placeholder="you@college.edu">
          </div>

          <!-- Two fields side by side from md up, stacked on a phone -->
          <div class="col-12 col-md-6">
            <label for="enrollment_no" class="form-label">Enrollment no.</label>
            <input type="text" class="form-control" id="enrollment_no"
                   name="enrollment_no" value="{{ form.get('enrollment_no', '') }}"
                   placeholder="MSCIT2026001">
          </div>

          <div class="col-12 col-md-6">
            <label for="phone" class="form-label">Phone</label>
            <input type="tel" class="form-control" id="phone" name="phone"
                   value="{{ form.get('phone', '') }}" inputmode="tel"
                   autocomplete="tel" placeholder="9876543210">
          </div>

          <div class="col-12 col-md-6">
            <label for="password" class="form-label">Password</label>
            <input type="password" class="form-control" id="password"
                   name="password" required minlength="6"
                   autocomplete="new-password">
            <div class="form-text">At least 6 characters.</div>
          </div>

          <div class="col-12 col-md-6">
            <label for="confirm" class="form-label">Confirm password</label>
            <input type="password" class="form-control" id="confirm"
                   name="confirm" required minlength="6"
                   autocomplete="new-password">
          </div>

          <div class="col-12">
            <button type="submit" class="btn btn-primary w-100">
              <i class="bi bi-check-circle"></i> Create account
            </button>
          </div>
        </div>
      </form>

      <p class="text-center small mt-3 mb-0">
        Already registered? <a href="{{ url_for('login') }}">Log in</a>
      </p>

    </div>
  </div>
</div>
{% endblock %}
