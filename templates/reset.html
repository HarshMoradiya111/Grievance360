{% extends "base.html" %}
{% block title %}Set new password &middot; Grievance360{% endblock %}

{% block content %}
<div class="row justify-content-center mt-2 mt-md-4">
  <div class="col-12 col-md-8 col-lg-5">
    <div class="ge-card p-3 p-md-4">

      <div class="text-center mb-3">
        <i class="bi bi-shield-lock fs-1" style="color:var(--ge-primary)"></i>
        <h4 class="mt-2 mb-0">Choose a new password</h4>
      </div>

      <form method="POST" novalidate>
        <div class="mb-3">
          <label for="password" class="form-label">New password</label>
          <input type="password" class="form-control" id="password"
                 name="password" required minlength="6"
                 autocomplete="new-password">
          <div class="form-text">At least 6 characters.</div>
        </div>

        <div class="mb-3">
          <label for="confirm" class="form-label">Confirm new password</label>
          <input type="password" class="form-control" id="confirm"
                 name="confirm" required minlength="6"
                 autocomplete="new-password">
        </div>

        <button type="submit" class="btn btn-primary w-100">
          <i class="bi bi-check-circle"></i> Update password
        </button>
      </form>

    </div>
  </div>
</div>
{% endblock %}
