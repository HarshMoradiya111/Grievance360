{% extends "base.html" %}
{% block title %}Login &middot; Grievance360{% endblock %}

{% block content %}
<!-- One centred column: full width on a phone, a narrow card on desktop. -->
<div class="row justify-content-center mt-2 mt-md-4">
  <div class="col-12 col-md-8 col-lg-5">
    <div class="ge-card p-3 p-md-4">

      <div class="text-center mb-3">
        <img src="/logo/Grievance360.png" alt="Grievance360 Logo" height="68" class="mb-2">
        <h4 class="mt-1 mb-0">Grievance360</h4>
        <div class="fw-semibold small mt-1" style="color:var(--ge-primary)">
          CHARUSAT — Student Grievance Portal
        </div>
        <p class="text-muted small mb-0 mt-1">
          Charotar University of Science &amp; Technology, Changa
        </p>
      </div>

      <form method="POST" novalidate>
        <div class="mb-3">
          <label for="email" class="form-label">Email address or Username</label>
          <input type="text" class="form-control" id="email" name="email"
                 value="{{ email }}" required autocomplete="username"
                 placeholder="admin, enrollment no., or you@college.edu">
        </div>

        <div class="mb-3">
          <label for="password" class="form-label">Password</label>
          <div class="input-group">
            <input type="password" class="form-control" id="password"
                   name="password" required autocomplete="current-password">
            <button class="btn btn-outline-secondary" type="button"
                    onclick="const f=document.getElementById('password');
                             f.type = f.type === 'password' ? 'text' : 'password';"
                    aria-label="Show or hide password">
              <i class="bi bi-eye"></i>
            </button>
          </div>
        </div>

        <!-- btn w-100 = full-width, easy to hit with a thumb -->
        <button type="submit" class="btn btn-primary w-100">
          <i class="bi bi-box-arrow-in-right"></i> Login
        </button>
      </form>

      <div class="d-flex justify-content-between mt-3 small">
        <a href="{{ url_for('forgot_password') }}">Forgot password?</a>
        <a href="{{ url_for('register') }}">Create an account</a>
      </div>

    </div>
  </div>
</div>
{% endblock %}
