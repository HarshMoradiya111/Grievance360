{% extends "base.html" %}
{% block title %}Edit department &middot; Grievance360{% endblock %}
{% block content %}

<div class="ge-page-head">
  <h4><i class="bi bi-building me-1"></i> Edit department — {{ dept.name }}</h4>
</div>

<div class="row justify-content-center">
  <div class="col-12 col-md-6">
    <div class="ge-card p-4">
      <form method="post">
        <div class="mb-3">
          <label class="form-label">Department name</label>
          <input type="text" class="form-control" name="name"
                 value="{{ form.get('name', dept.name) }}" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Contact email</label>
          <input type="email" class="form-control" name="email"
                 value="{{ form.get('email', dept.email) }}" required>
        </div>
        <div class="d-flex gap-2">
          <button class="btn btn-primary">
            <i class="bi bi-check2"></i> Save
          </button>
          <a href="{{ url_for('admin_departments') }}" class="btn btn-outline-secondary">
            Cancel
          </a>
        </div>
      </form>
    </div>
  </div>
</div>

{% endblock %}
